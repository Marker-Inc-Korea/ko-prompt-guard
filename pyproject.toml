[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-prompt-guard"
version = "1.1.0"
description = "Deterministic Korean prompt-injection / jailbreak de-obfuscation and guard"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marker Inc Korea" }]
keywords = ["korean", "prompt-injection", "jailbreak", "llm", "guardrail", "security", "unicode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Core is pure-stdlib + pydantic. No ML, no network. (ko-pii unicode_norm is
# vendored & extended, not imported, to keep this self-contained.)
dependencies = [
    "pydantic>=2.0,<3",
]

[project.scripts]
ko-prompt-guard = "ko_prompt_guard.cli:main"

[project.urls]
Homepage = "https://github.com/Marker-Inc-Korea/ko-prompt-guard"
Repository = "https://github.com/Marker-Inc-Korea/ko-prompt-guard"
Issues = "https://github.com/Marker-Inc-Korea/ko-prompt-guard/issues"
Changelog = "https://github.com/Marker-Inc-Korea/ko-prompt-guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
    "mypy>=1.10,<3",
]
# Opt-in: default bge-m3 backend for EmbeddingReviewer (Tier-2 semantic). Core stays
# pure (pydantic only); torch/transformers are pulled only by the default encoder.
embedding = [
    "torch>=2.0,<3",
    "transformers>=4.40,<6",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
ko_prompt_guard = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests embed long, literal obfuscated payloads that must not be reflowed.
"tests/**" = ["E501"]
# Pattern dictionary is dense regex data; long lines are intentional.
"src/ko_prompt_guard/patterns.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["torch", "transformers", "transformers.*"]
ignore_missing_imports = true
